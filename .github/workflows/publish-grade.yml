name: CP5 — Publish Final Grade

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: ${{ github.repository == 'KLIS-CS/GitHub-Final-Integrated-Challenge' && !github.event.issue.pull_request && contains(github.event.issue.body, '### Practice Repository URL') }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish CP5 grade record
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const student = issue.user.login;
            const scoreMarker = '<!-- klis-cp5-external-score -->';
            const allowedGraders = new Set(['hbycwyh2008']);
            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            function parseManualGrade(body) {
              if (!body) return null;
              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) return { score: Number(legacy[1]), breakdown: null, feedback: '' };
              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;
              const readScore = (label, max) => {
                const m = body.match(new RegExp(`^\\s*${escapeRegex(label)}:\\s*(\\d{1,2})\\s*\\/\\s*${max}\\s*$`, 'mi'));
                if (!m) return null;
                const n = Number(m[1]);
                return n <= max ? n : null;
              };
              const breakdown = {
                workflow: readScore('Workflow independence', 10),
                project: readScore('Project evidence', 5),
                concepts: readScore('Concepts', 10),
                debugging: readScore('Debugging', 10),
                reflection: readScore('Reflection', 5)
              };
              if (Object.values(breakdown).some(v => v === null)) return null;
              const feedback = body.match(/(?:^|\n)\s*Feedback:\s*\n([\s\S]*)$/i)?.[1]?.trim() || '';
              return { score: Object.values(breakdown).reduce((a,b) => a+b, 0), breakdown, feedback };
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            const scoreComment = [...comments].reverse().find(c => c.user?.type === 'Bot' && c.body?.includes(scoreMarker));
            const automatic = Math.max(0, Math.min(60, Number(scoreComment?.body?.match(/\*\*Automatic score:\*\*\s*(\d+)\/60/i)?.[1] || 0)));

            let manual = null;
            for (const c of [...comments].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))) {
              if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
              const grade = parseManualGrade(c.body || '');
              if (grade) { manual = { ...grade, grader: c.user.login }; break; }
            }

            const teacher = manual?.score ?? null;
            const total = automatic + (teacher ?? 0);
            const finalLine = teacher === null ? 'pending teacher review' : `${total}/100`;
            const repositoryUrl = issue.body?.match(/### Practice Repository URL\s*\n+([^\n]+)/i)?.[1]?.trim() || '';

            // The submission grader comment is the single student-facing score display.
            // This workflow only publishes the machine-readable grade record used by dashboards/sync systems.

            const gradeBranch = 'grades';
            try { await github.rest.git.getRef({ owner, repo, ref: `heads/${gradeBranch}` }); }
            catch (e) {
              if (e.status !== 404) throw e;
              const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${gradeBranch}`, sha: mainRef.data.object.sha });
            }

            const gradePath = `.cp5-grades/${student.toLowerCase()}.json`;
            const gradeData = {
              version: 1,
              checkpoint: 'CP5',
              student: student.toLowerCase(),
              repository: repositoryUrl,
              automaticAtMother: automatic,
              teacherScore: teacher,
              finalAtMother: teacher === null ? null : total,
              grader: manual?.grader || null,
              breakdown: manual?.breakdown || null,
              feedback: manual?.feedback || '',
              submissionIssue: `https://github.com/${owner}/${repo}/issues/${issueNumber}`,
              updatedAt: new Date().toISOString()
            };

            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path: gradePath, ref: gradeBranch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: gradePath, branch: gradeBranch,
              message: `Publish CP5 grade for ${student}`,
              content: Buffer.from(JSON.stringify(gradeData, null, 2) + '\n').toString('base64'),
              ...(sha ? { sha } : {})
            });
